[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mercupix"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Marie Aubert", email = "m.aubert@ip2i.in2p3.fr" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    # basics
    "numpy>=2.0",
    "h5py",
    "scipy>=1.15",
    "matplotlib",
    # Data Science
    "scikit-image",
    "bottleneck",
    "joblib",
    # astro
    "astropy",
  ]

[project.optional-dependencies]
docs = [
    "myst-nb",
    "sphinx>=7.2",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-design",
  ]

[project.urls]
Source = "https://github.com/m-aubert/mercupix"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "mercupix.__version__"}


[tool.ruff]
exclude = ["tests", "docs"]
include = ["*.py"]

[tool.ruff.lint]
# Skip unused variable rules (`F841`).
extend-ignore = ["F841", "E402",
                "C408", # unneccessary dict call.
                "B006", # Do not use mutable data structures for argument defaults
                "SIM102", # use single ifs
                "RUF012", # Mutable default value for class attribute"
                "I001", # Import block is un-sorted or un-formatted
                "RUF059", # Unpacked variable `pixelarea` is never used | that is for me to explicitely see all that is returned
                "PIE790", # Unnecessary `pass` statement
                ]
